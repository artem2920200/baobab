# ============================================================
#  WALL BOT — Binance USDT-M Futures
#  Поиск плотностей в стакане + вход на отскок
# ============================================================

# Режим торговли: paper (симуляция) | testnet | live (реальные деньги!)
mode: live

# Источник рыночных данных: auto | live | demo
#   auto — реальный Binance, при недоступности автоматически demo
#   demo — синтетический рынок для отладки интерфейса (ордера не отправляются)
data_source: auto

api:
  # Ключи Binance Futures. Можно задать здесь или через переменные окружения
  # BINANCE_API_KEY / BINANCE_API_SECRET (env имеет приоритет).
  # Без ключей в режиме live бот работает как монитор: сигналит, но не торгует.
  key: ""
  secret: ""
  recv_window: 10000

# ---------- Фильтр монет ----------
scan:
  min_volume_24h_usd: 1000000   # дневной объём > $1 млн
  natr_period: 14               # период ATR/NATR
  natr_max_pct: 1.0             # NATR(14) на 5m не более 1%
  kline_interval: 5m
  refresh_sec: 300              # как часто пересчитывать список монет
  max_symbols: 50               # максимум монет под наблюдением (топ по объёму)

# ---------- Стакан ----------
book:
  depth_limit: 500              # глубина REST-снапшота (500 уровней на сторону)
  depth_speed: 250ms            # частота diff-depth стрима: 100ms | 250ms | 500ms

# ---------- Определение плотности ----------
walls:
  volume_window_min: 15         # окно рыночного объёма, минут
  ratio: 2.0                    # стена >= 2x объёма сделок за 15 минут
  min_wall_usd: 20000           # абсолютный минимум стены, $ (защита от мусора на тонких монетах)
  max_distance_pct: 2.0         # искать стены не дальше 2% от цены
  cluster_gap_pct: 0.05         # склеивать соседние уровни в кластер, если зазор <= 0.05%
  max_cluster_width_pct: 0.35   # максимальная ширина кластера, %
  min_seed_frac: 0.35           # в кластере должен быть уровень >= 35% порога (концентрация)
  anomaly_mult: 8               # кластер >= 8x медианного уровня вокруг (0 = выключить)
  pull_grace_sec: 3.0           # сколько ждать перед признанием стены снятой
  min_age_sec: 2.0              # минимальный возраст стены для входа (анти-спуфинг)
  match_tolerance_pct: 0.15     # допуск сопоставления стены между тиками детектора

# ---------- Сигнал подхода цены ----------
signal:
  approach_pct: 0.10            # цена подошла к стене на 0.10% -> уведомление + вход

# ---------- Торговля и риск ----------
trading:
  autotrade: true               # автовход (можно переключать в интерфейсе)
  risk_per_trade: 0.01          # риск на сделку: 1% от депозита (расстояние до стопа)
  max_leverage: 5               # плечо (изолированная маржа)
  margin_type: ISOLATED         # ISOLATED | CROSSED
  max_open_positions: 3         # одновременных позиций максимум
  cooldown_sec: 900             # пауза по монете после закрытия позиции, сек
  stop_buffer_pct: 0.10         # стоп за дальней границей стены + 0.10%
  max_stop_pct: 1.0             # если стоп дальше 1% от входа — сделку пропускаем
  fee_rate: 0.0005              # комиссия тейкера 0.05% (paper)
  slippage_pct: 0.02            # проскальзывание, % (paper)
  exit_on_wall_pull: true       # выходить, если стену убрали после входа (спуфинг)
  paper_equity: 1000            # стартовый депозит для paper-режима, $

  # Лестница фиксации прибыли (% движения ЦЕНЫ от входа):
  #   +1% -> закрыть 50% и перевести стоп в безубыток
  #   +2% -> закрыть ещё 25% от исходной позиции
  #   +3% -> закрыть остаток
  take_profit:
    - { move_pct: 1.0, close_frac: 0.50, breakeven: true }
    - { move_pct: 2.0, close_frac: 0.25 }
    - { move_pct: 3.0, close_frac: 1.00 }   # последний шаг закрывает весь остаток
  breakeven_offset_pct: 0.0     # сдвиг безубытка от входа (0.05 покроет комиссии)

# ---------- Telegram ----------
telegram:
  enabled: true
  token: ""                     # или env TG_BOT_TOKEN
  chat_id: ""                   # или env TG_CHAT_ID
  # какие события слать: approach, entry, tp, breakeven, stop, close, pull, error
  events: [approach, entry, tp, breakeven, stop, close, pull, error]

# ---------- Веб-интерфейс ----------
server:
  host: 0.0.0.0
  port: 8000
